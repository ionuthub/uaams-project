# End-to-end demo-path test (Playwright) against production.
# Triggers: manually from the Actions tab, and on every release to main.
# Needs repo secrets E2E_EMAIL and E2E_PASSWORD (verified test student
# account). Without them the test skips and the run stays green.
# Screenshots, videos and the HTML report are uploaded as artifacts on
# every run - that is the evidence trail for the PID testing section.

name: e2e

on:
  workflow_dispatch:
  push:
    branches: [main]

# This suite runs against PRODUCTION with one shared test student and shared
# admin accounts, so two runs at once corrupt each other. Merging #217 and #218
# seconds apart started runs #24 and #25 together: #25 passed, #24 failed on a
# document upload while the other run was uploading as the same student.
#
# Queue rather than cancel. cancel-in-progress would discard a run, and every
# run is evidence for the report - the screenshots and the pass/fail record are
# the point, so none of them should be thrown away.
concurrency:
  group: e2e-production
  cancel-in-progress: false

jobs:
  demo-path:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright (not saved to the app dependencies)
        run: npm install --no-save @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run demo-path test
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          # Second university admin (#25, #199). The isolation spec skips itself
          # when these are absent, so the suite stays green until they are set.
          E2E_ADMIN2_EMAIL: ${{ secrets.E2E_ADMIN2_EMAIL }}
          E2E_ADMIN2_PASSWORD: ${{ secrets.E2E_ADMIN2_PASSWORD }}
        run: npx playwright test -c e2e/playwright.config.mjs
      - name: Upload evidence (screenshots, videos, report)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: |
            e2e-results
            e2e-report
          if-no-files-found: ignore
