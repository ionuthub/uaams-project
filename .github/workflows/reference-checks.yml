name: application-reference-checks

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'lib/application-reference*'
      - 'app/api/applications/references/**'
      - 'lib/db.js'
      - 'firestore.rules'
      - 'tests/application-reference*'
      - 'firebase.references-test.json'
      - '.github/workflows/reference-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-firestore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm test
      - name: Install emulator test tooling
        run: npm install --no-save --package-lock=false --no-audit --no-fund firebase-tools@14 @firebase/rules-unit-testing@4
      - name: Verify allocation and rules without production access
        run: npx firebase emulators:exec --only firestore --project demo-uaams-references --config firebase.references-test.json 'node --test tests/application-reference.emulator.mjs'
